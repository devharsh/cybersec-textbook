<g class="st s6"><text x="550.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Contain and preserve run in parallel: isolate to stop the spread, but capture volatile evidence first where you can.</text></g>
