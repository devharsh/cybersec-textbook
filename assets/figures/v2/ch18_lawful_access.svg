<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">End-to-end encryption and the lawful-access debate</title><desc id="d">Top: with end-to-end encryption, Alice&#x27;s message is encrypted on her phone and decrypted only on Bob&#x27;s; the service relays ciphertext it cannot read. Bottom: exceptional access adds an escrowed key that lets an authorized party decrypt, but the escrowed key is a single point of failure that attackers will target. Strong encryption protects everyone and can impede investigations; there is no purely technical resolution.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
