<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">QUIC folds the TLS 1.3 handshake into transport setup: one round trip instead of two</title><desc id="d">Left, TCP plus TLS 1.3: the TCP handshake takes one round trip, then the TLS handshake takes another, so the first HTTP request goes out after two round trips. Right, QUIC over UDP: the first packet already carries the TLS ClientHello, the server answers with its handshake, and the client sends its Finished with the HTTP/3 request after one round trip. Most QUIC metadata is encrypted, and Encrypted Client Hello also hides the server name.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}.s9{animation-delay:7.20s}.s10{animation-delay:8.10s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
