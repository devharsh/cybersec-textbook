<text x="550.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">QUIC encrypts most connection metadata, and Encrypted Client Hello (ECH) hides the server name, so defenders lean on endpoints and DNS logs.</text>
