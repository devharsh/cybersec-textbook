<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Host discovery: a ping sweep, and why silence does not mean absence</title><desc id="d">The scanner sends ICMP Echo Requests, type 8, across a range. Live hosts answer with Echo Replies, type 0. Addresses with no host stay silent, but so does a live host that blocks ICMP, which is why Nmap adds other probes. As root on the same subnet Nmap sends an ARP request; on a different subnet it sends an ICMP echo, a TCP SYN to 443, a TCP ACK to 80, and an ICMP timestamp request. The -Pn option skips discovery.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
