<rect width="1000" height="600" fill="#ffffff"/>
<text x="500.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">The social-engineering attack lifecycle: research, hook, play, exit</text>
<circle cx="500" cy="315" r="180" fill="none" fill-opacity="1" stroke="#c5ccd3" stroke-width="3"/>
<use href="#i-attacker" x="450.0" y="255.0" width="100" height="100"/><text x="500.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Social engineer</text>
<g class="st s1"><circle cx="500.0" cy="135.0" r="50" fill="#ffffff" fill-opacity="1" stroke="#1f4e9c" stroke-width="3"/></g>
<g class="st s1"><use href="#i-search" x="468.0" y="99.0" width="64" height="64"/></g>
<g class="st s1"><text x="575.0" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f4e9c" font-weight="bold" text-anchor="start">Research</text></g>
<g class="st s1"><text x="575.0" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">OSINT: website, social media,</text><text x="575.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">job posts, dumpster diving</text></g>
<g class="st s1"><circle cx="462.0" cy="97.0" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="462.0" y="101.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><path d="M567.4 148.1 L667.0 247.6" fill="none" stroke="#1f4e9c" stroke-width="3" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/></g>
<g class="st s2"><circle cx="680.0" cy="315.0" r="50" fill="#ffffff" fill-opacity="1" stroke="#d9822b" stroke-width="3"/></g>
<g class="st s2"><use href="#i-fishhook" x="648.0" y="279.0" width="64" height="64"/></g>
<g class="st s2"><text x="755.0" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#d9822b" font-weight="bold" text-anchor="start">Hook</text></g>
<g class="st s2"><text x="755.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">make contact, use a pretext,</text><text x="755.0" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">build rapport and trust</text></g>
<g class="st s2"><circle cx="642.0" cy="277.0" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="642.0" y="281.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><path d="M666.9 382.4 L567.5 481.9" fill="none" stroke="#d9822b" stroke-width="3" marker-end="url(#a-d9822b)" stroke-linejoin="round"/></g>
<g class="st s3"><circle cx="500.0" cy="495.0" r="50" fill="#ffffff" fill-opacity="1" stroke="#c0392b" stroke-width="3"/></g>
<g class="st s3"><use href="#i-money" x="468.0" y="459.0" width="64" height="64"/></g>
<g class="st s3"><text x="575.0" y="517.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c0392b" font-weight="bold" text-anchor="start">Play</text></g>
<g class="st s3"><text x="575.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">exploit the trust: password,</text><text x="575.0" y="553.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">wire transfer, access, malware</text></g>
<g class="st s3"><circle cx="462.0" cy="457.0" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="462.0" y="461.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M432.6 481.9 L333.0 382.4" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s4"><circle cx="320.0" cy="315.0" r="50" fill="#ffffff" fill-opacity="1" stroke="#6a3d9a" stroke-width="3"/></g>
<g class="st s4"><use href="#i-door" x="288.0" y="279.0" width="64" height="64"/></g>
<g class="st s4"><text x="245.0" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6a3d9a" font-weight="bold" text-anchor="end">Exit</text></g>
<g class="st s4"><text x="245.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="end">withdraw cleanly so the</text><text x="245.0" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="end">intrusion goes unnoticed</text></g>
<g class="st s4"><circle cx="282.0" cy="277.0" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="282.0" y="281.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><path d="M333.1 247.6 L432.6 148.1" fill="none" stroke="#52606d" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#a-52606d)" stroke-linejoin="round"/></g>
<g class="st s5"><text x="250.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="bold" text-anchor="middle" font-style="italic">repeat for deeper access</text></g>
<g class="st s5"><circle cx="250" cy="172" r="12" fill="#52606d" stroke="#fff" stroke-width="2"/><text x="250.0" y="176.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
</svg>