<rect x="56" y="34" width="34" height="24" rx="2" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><path d="M56 34 l17 13 l17 -13" fill="none" stroke="#c0392b" stroke-width="1.6"/>
</symbol>
