<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d"><title id="t">The social-engineering attack lifecycle: research, hook, play, exit</title><desc id="d">Four phases around a cycle. Research: the attacker gathers open-source intelligence from websites, social media, job postings, and trash. Hook: the attacker makes contact with a pretext and builds trust. Play: the attacker uses that trust to get a password, a wire transfer, physical access, or malware run. Exit: the attacker withdraws without arousing suspicion. Sophisticated campaigns repeat the cycle for deeper access.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
