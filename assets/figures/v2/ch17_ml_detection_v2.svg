<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">Why learning-based detection complements signatures (illustrative numbers)</title><desc id="d">Illustrative detection rates. Pattern matching: 97 percent on known threats, 10 percent on novel ones. Machine learning: 93 and 62 percent. Deep learning: 95 and 74 percent. Signatures excel on known threats but miss novel ones; learned models generalize better.</desc>
