<g class="st s3"><path d="M340.0 205.0 L420.0 205.0" fill="none" stroke="#d9822b" stroke-width="2.2" marker-end="url(#a-d9822b)" stroke-linejoin="round"/></g>
<g class="st s3"><circle cx="420" cy="150" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="420.0" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s3"><use href="#i-warning" x="47.0" y="317.0" width="26" height="26"/></g>
<g class="st s3"><text x="80.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d9822b" font-weight="bold" text-anchor="start">throughput can roughly halve</text></g>
<g class="st s3"><text x="80.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d9822b" font-weight="bold" text-anchor="start">second SSID: devices cling to the weak signal</text></g>
