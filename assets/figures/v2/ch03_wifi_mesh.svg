<g class="st s6"><circle cx="720" cy="300" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="720.0" y="304.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text></g>
<g class="st s6"><text x="820.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="middle">one logical network, one set of credentials</text></g>
<g class="st s7"><use href="#i-lock" x="285.0" y="435.0" width="30" height="30"/></g>
<g class="st s7"><circle cx="270" cy="438" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="270.0" y="442.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">7</text></g>
<g class="st s7"><text x="322.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">Either way: WPA3, a strong unique passphrase, current firmware on every node, and a separate guest or IoT network.</text></g>
