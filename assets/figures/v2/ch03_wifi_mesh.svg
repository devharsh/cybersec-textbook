<g class="st s4"><circle cx="1062" cy="66" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="1062.0" y="70.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
