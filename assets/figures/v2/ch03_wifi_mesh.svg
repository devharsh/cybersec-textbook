<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Growing Wi-Fi coverage: a range extender versus a mesh system</title><desc id="d">Left: a range extender repeats the router&#x27;s signal on the same radio, which can roughly halve throughput, and older models create a second network name, so devices do not roam to the stronger signal. Right: a mesh system uses coordinated nodes with one network name and seamless handoff, ideally over Ethernet backhaul, giving one set of credentials to manage. Either way, use WPA3, a strong passphrase, current firmware, and a separate guest or IoT network.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
