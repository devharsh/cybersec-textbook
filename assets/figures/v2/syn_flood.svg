<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">TCP three-way handshake versus a SYN flood</title><desc id="d">Left: a normal handshake. The client sends SYN, the server replies SYN-ACK, the client sends ACK, and the connection is established. Right: an attacker sends many SYN packets from spoofed source addresses and never sends the final ACK, so half-open connections fill the server&#x27;s backlog and a legitimate client is refused.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
