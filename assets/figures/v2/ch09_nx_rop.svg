<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">After the overflow: injected shellcode or reused code, and the mitigations against each</title><desc id="d">An overflow overwrites the saved return address. If the stack is executable, the attacker injects and runs shellcode. If NX or DEP makes it non-executable, the attacker reuses existing code through return-to-libc or a chain of ROP gadgets. Against all of these: ASLR randomizes addresses, a stack canary detects the overwrite, CFI and shadow stacks block bad returns, and least privilege limits the damage.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
