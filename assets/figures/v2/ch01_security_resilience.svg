<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">Security reduces how often incidents happen; resilience reduces what each one costs</title><desc id="d">Service level over time for two organizations hit by the same attack. The prevention-only organization drops far and recovers slowly because nothing contains the damage. The resilient organization, with segmentation, tested backups, and replaceable components, drops less and recovers quickly.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
