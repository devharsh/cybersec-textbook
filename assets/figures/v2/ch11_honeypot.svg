<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Deception: decoys that no legitimate user should ever touch</title><desc id="d">Inside the production network sit a honeypot, a decoy server, and honeytokens: a fake credential and a canary file. An attacker who has broken in explores, touches a decoy, and triggers an alert to the security team. Because nobody has a legitimate reason to use a decoy, the alert is almost never a false positive.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
