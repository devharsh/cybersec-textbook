<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Chain of custody: every hand-off recorded, from seizure to court</title><desc id="d">A responder seizes the laptop, bags it, hashes the image, and signs the custody form. Each transfer, to the courier, the lab analyst, and the evidence locker, and finally to court, is logged with who, when, and why, and the hash is re-verified. An unrecorded transfer is a break that lets the defense argue tampering.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
