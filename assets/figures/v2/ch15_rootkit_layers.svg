<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Rootkits hide by sitting below the tools that look for them</title><desc id="d">A stack from top to bottom: applications and security tools, user-mode libraries, the operating system kernel, the boot process with the MBR or UEFI, firmware and device controllers, and hardware with a TPM. A user-mode rootkit hooks library calls; a kernel-mode rootkit changes kernel structures so tools that ask the kernel are blind; a bootkit loads before the operating system; firmware implants are deepest. Secure Boot and measured boot anchored in a TPM verify each stage, because a monitor can be trusted only if it sits below what it monitors.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
