<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Server-side request forgery: the server fetches what the attacker names</title><desc id="d">A web feature fetches a URL the user supplies. The attacker supplies an internal address instead, such as the cloud instance metadata service at 169.254.169.254 or http://localhost:8080/admin. The server, inside the firewall, makes the request and returns the response, which can include temporary credentials for the host&#x27;s IAM role. Defenses: allow-list outbound targets, block internal and metadata addresses, and require IMDSv2 session tokens.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
