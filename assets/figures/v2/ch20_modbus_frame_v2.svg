<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">A complete Modbus TCP request: write coil 10 to ON, sent to TCP port 502</title><desc id="d">Top: an HMI and an attacker on the same segment can both send the same request to the PLC on TCP port 502, and the PLC cannot tell them apart. Below, the twelve bytes: MBAP header of 7 bytes, transaction ID 00 01, protocol ID 00 00, length 00 06, unit ID 01; then the protocol data unit of 5 bytes, function code 05 Write Single Coil, output address 00 0A for coil 10, output value FF 00 for ON. No field carries identity, integrity, or freshness.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
