<text x="550.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">The browser also checks the name, the validity dates, and revocation before it trusts the server&#x27;s key.</text>
