<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Public key infrastructure: a chain of trust from a root the browser already trusts</title><desc id="d">A root certificate authority, kept offline, signs an intermediate CA certificate. The intermediate signs the web server&#x27;s leaf certificate. The server sends its leaf and the intermediate; the browser checks each signature up to a root in its trust store, checks names, dates, and revocation, and only then trusts the server&#x27;s public key.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
