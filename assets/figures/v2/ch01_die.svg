<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d"><title id="t">DIE triad for infrastructure: Distributed, Immutable, Ephemeral</title><desc id="d">Three cards. Distributed: spread out, so losing one node does not stop service, which supports availability. Immutable: never changed in place but replaced, which supports integrity. Ephemeral: short-lived, so there is less to steal, which supports confidentiality. The DIE triad complements the CIA triad, which protects data: cattle, not pets.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
<defs><linearGradient id="g-box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f8fe"/><stop offset="1" stop-color="#c9ddf4"/></linearGradient><filter id="f-drop" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="1.5" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".18"/></filter>

<linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5361"/><stop offset=".5" stop-color="#2b313a"/><stop offset="1" stop-color="#1c2027"/></linearGradient>
<linearGradient id="g-steel-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8796"/><stop offset="1" stop-color="#4a5361"/></linearGradient>
<linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#b9c0c9"/></linearGradient>
<linearGradient id="g-silver-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8dde3"/><stop offset="1" stop-color="#9aa3ae"/></linearGradient>
<linearGradient id="g-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fc3ff"/><stop offset=".55" stop-color="#1e88e5"/><stop offset="1" stop-color="#0b4f9c"/></linearGradient>
<linearGradient id="g-router" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb6e8"/><stop offset="1" stop-color="#1f5f99"/></linearGradient>
<linearGradient id="g-router-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f4fc"/><stop offset="1" stop-color="#a9cdea"/></linearGradient>
<linearGradient id="g-db" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e99a6"/><stop offset=".45" stop-color="#e3e7eb"/><stop offset="1" stop-color="#7b8693"/></linearGradient>
<linearGradient id="g-brick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2774f"/><stop offset="1" stop-color="#b2472a"/></linearGradient>
<linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8dcf5"/></linearGradient>
<linearGradient id="g-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d7bf"/><stop offset="1" stop-color="#e2b394"/></linearGradient>
<linearGradient id="g-suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2733"/></linearGradient>
<linearGradient id="g-suit2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b5ea7"/><stop offset="1" stop-color="#46336b"/></linearGradient>
<linearGradient id="g-hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#0f1216"/></linearGradient>
<linearGradient id="g-robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8eef5"/><stop offset="1" stop-color="#9fb0c3"/></linearGradient>
<linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d49a1f"/></linearGradient>
<linearGradient id="g-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e9ef"/></linearGradient>
<linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd38b"/><stop offset="1" stop-color="#2e8b45"/></linearGradient>
<linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#c62828"/></linearGradient>
<radialGradient id="g-shadow"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="g-suit3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e86c1"/><stop offset="1" stop-color="#1b4f72"/></linearGradient>
<symbol id="i-nodes" viewBox="0 0 100 100">
<g stroke="#5b9bd5" stroke-width="3"><line x1="50" y1="20" x2="20" y2="70"/><line x1="50" y1="20" x2="80" y2="70"/><line x1="20" y1="70" x2="80" y2="70"/><line x1="50" y1="20" x2="50" y2="52"/><line x1="20" y1="70" x2="50" y2="52"/><line x1="80" y1="70" x2="50" y2="52"/></g>
<circle cx="50" cy="20" r="11" fill="url(#g-router)" stroke="#164b78" stroke-width="1.6"/><circle cx="20" cy="70" r="11" fill="url(#g-router)" stroke="#164b78" stroke-width="1.6"/><circle cx="80" cy="70" r="11" fill="url(#g-router)" stroke="#164b78" stroke-width="1.6"/><circle cx="50" cy="52" r="11" fill="url(#g-router)" stroke="#164b78" stroke-width="1.6"/></symbol>
<symbol id="i-lock" viewBox="0 0 100 100"><ellipse cx="50" cy="95" rx="38" ry="4.5" fill="url(#g-shadow)"/>
<path d="M32 44 V30 a18 18 0 0 1 36 0 V44" fill="none" stroke="#7d8796" stroke-width="7"/>
<rect x="22" y="42" width="56" height="44" rx="6" fill="url(#g-gold)" stroke="#a5760e" stroke-width="1.4"/>
<circle cx="50" cy="60" r="6" fill="#5d4006"/><rect x="47.5" y="62" width="5" height="12" rx="2" fill="#5d4006"/>
</symbol>
<symbol id="i-hourglass" viewBox="0 0 100 100"><ellipse cx="50" cy="95" rx="38" ry="4.5" fill="url(#g-shadow)"/>
<rect x="24" y="8" width="52" height="8" rx="3" fill="#8d6e63" stroke="#4e342e"/><rect x="24" y="84" width="52" height="8" rx="3" fill="#8d6e63" stroke="#4e342e"/>
<path d="M30 16 H70 C70 36 54 42 54 50 C54 58 70 64 70 84 H30 C30 64 46 58 46 50 C46 42 30 36 30 16 Z" fill="#e3f2fd" stroke="#5b9bd5" stroke-width="2"/>
<path d="M36 26 H64 C62 36 52 42 50 47 C48 42 38 36 36 26 Z" fill="#f2b84b"/>
<path d="M34 82 H66 C64 72 56 68 50 66 C44 68 36 72 34 82 Z" fill="#f2b84b"/>
</symbol>
</defs>
<rect width="1000" height="350" fill="#ffffff"/>
<text x="500.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">DIE triad for infrastructure: Distributed, Immutable, Ephemeral</text>
<g class="st s1"><rect x="70" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#16a085" stroke-width="2.2" filter="url(#f-drop)"/><rect x="70" y="60" width="260" height="8" rx="4" fill="#16a085"/><use href="#i-nodes" x="152.0" y="74.0" width="96.0" height="96.0"/><text x="200.0" y="188.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#16a085" font-weight="bold" text-anchor="middle">Distributed</text><text x="200.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">spread out, so one loss</text><text x="200.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">does not stop service</text><text x="200.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">(supports Availability)</text></g>
<g class="st s1"><circle cx="84" cy="72" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="84.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><rect x="370" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#8e44ad" stroke-width="2.2" filter="url(#f-drop)"/><rect x="370" y="60" width="260" height="8" rx="4" fill="#8e44ad"/><use href="#i-lock" x="452.0" y="74.0" width="96.0" height="96.0"/><text x="500.0" y="188.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8e44ad" font-weight="bold" text-anchor="middle">Immutable</text><text x="500.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">never changed in place;</text><text x="500.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">replace, do not patch</text><text x="500.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">(supports Integrity)</text></g>
<g class="st s2"><circle cx="384" cy="72" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="384.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><rect x="670" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#d35400" stroke-width="2.2" filter="url(#f-drop)"/><rect x="670" y="60" width="260" height="8" rx="4" fill="#d35400"/><use href="#i-hourglass" x="752.0" y="74.0" width="96.0" height="96.0"/><text x="800.0" y="188.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d35400" font-weight="bold" text-anchor="middle">Ephemeral</text><text x="800.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">short-lived, so there is</text><text x="800.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">less to steal</text><text x="800.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">(supports Confidentiality)</text></g>
<g class="st s3"><circle cx="684" cy="72" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="684.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s3"><text x="500.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Complements CIA, which protects data: treat servers as cattle, not pets.</text></g>
</svg>