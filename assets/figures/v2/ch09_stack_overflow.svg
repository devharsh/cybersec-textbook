<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-labelledby="t d"><title id="t">A stack buffer overflow: too much input spills into the neighbors</title><desc id="d">Left: a process&#x27;s memory, with text, data and BSS, a heap that grows up, and a stack that grows down. Right: the frame of buf1_pass.c holds a 15-byte buffer, the pass integer, the saved base pointer, and the return address. gets() copies a long input with no bounds check; the bytes run past the buffer toward higher addresses, set pass to non-zero so root privileges are granted without the password, and with enough bytes overwrite the saved return address.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
