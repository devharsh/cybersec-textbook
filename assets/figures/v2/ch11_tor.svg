<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d"><title id="t">Tor: three relays, three layers, and no relay that knows both ends</title><desc id="d">The user&#x27;s Tor client wraps the request in three layers of encryption and sends it through an entry guard, a middle relay, and an exit relay. The guard sees the user but not the destination, the middle relay sees neither, and the exit sees the destination but not the user. The exit can read anything not protected by end-to-end encryption, so HTTPS still matters.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
