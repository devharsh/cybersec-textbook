<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Deepfake wire fraud: a video call where every other face is synthetic</title><desc id="d">Based on the widely reported 2024 Arup case. The attackers gather public video and audio of executives, use AI to clone their faces and voices, send a message about a confidential transaction, and hold a video call in which the other participants are deepfakes. The employee makes transfers totaling roughly 25 million US dollars. Callback to a known number, code words, dual approval, and out-of-band confirmation would have stopped the payment.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
