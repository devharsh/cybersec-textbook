<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">Footprinting: passive sources never touch the target; active techniques do</title><desc id="d">Passive sources on the left: the target&#x27;s website, social media, job boards, WHOIS and registry data, search-engine dorking, and document metadata, breach data, and EDGAR filings; none of them sends traffic to the target. Active techniques on the right touch the target&#x27;s systems and need authorization: DNS queries and zone-transfer attempts, banner grabbing, and network range mapping with traceroute, leading into scanning.</desc>
