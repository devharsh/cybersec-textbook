<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290" width="1060" height="290" role="img" aria-labelledby="t d"><title id="t">AAA: Authentication, Authorization, Accounting</title><desc id="d">A user reaches a protected server through three checks in order: authentication asks who are you and verifies identity, authorization asks what may you do and applies permissions, and accounting asks what did you do and records it in logs for audit.</desc>
