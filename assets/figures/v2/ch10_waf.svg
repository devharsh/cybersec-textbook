<g class="st s1"><path d="M132.0 140.0 L372.0 140.0" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#a-c0392b)" stroke-linejoin="round"/><text x="252.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">&#x27; OR &#x27;1&#x27;=&#x27;1</text></g>
<g class="st s1"><use href="#i-cross" x="387.0" y="127.0" width="26" height="26"/></g>
<g class="st s1"><text x="400.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">blocked</text></g>
<g class="st s1"><circle cx="140" cy="120" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="140.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><path d="M132.0 200.0 L812.0 200.0" fill="none" stroke="#d9822b" stroke-width="2.6" marker-end="url(#a-d9822b)" stroke-linejoin="round"/><text x="247.6" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d9822b" font-weight="bold" text-anchor="middle">%2527%2520OR... (double-encoded)</text></g>
<g class="st s2"><use href="#i-bug" x="885.0" y="115.0" width="30" height="30"/></g>
<g class="st s2"><text x="640.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d9822b" font-weight="bold" text-anchor="middle">slips past the rules</text></g>
<g class="st s2"><circle cx="122" cy="220" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="122.0" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><text x="40.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d9822b" font-weight="bold" text-anchor="start">Common bypasses</text></g>
<g class="st s3"><circle cx="24" cy="294" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="24.0" y="298.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s3"><text x="60.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- encoding: double URL, Unicode</text></g>
<g class="st s3"><text x="60.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- HTTP request smuggling</text></g>
<g class="st s3"><text x="60.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- case variation</text></g>
<g class="st s3"><text x="60.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- fragments that combine into an attack</text></g>
<g class="st s4"><rect x="560.0" y="290.0" width="510.0" height="150.0" rx="8" fill="#e8f5e9" fill-opacity="1" stroke="#2e7d32" stroke-width="1.6"/></g>
<g class="st s4"><circle cx="560" cy="290" r="12" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text x="560.0" y="294.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s4"><text x="580.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="start">Use a WAF for</text></g>
<g class="st s4"><text x="580.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">+ known signatures and automated scanners</text></g>
<g class="st s4"><text x="580.0" y="368.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">+ virtual patching until the code is fixed</text></g>
<g class="st s4"><text x="580.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">but fix the code: parameterized queries, encoding,</text></g>
<g class="st s4"><text x="580.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">authorization checks</text></g>
</svg>