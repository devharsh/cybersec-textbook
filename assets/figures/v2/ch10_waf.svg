<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">A web application firewall: a useful filter, not a fix</title><desc id="d">Requests pass through the WAF before the application. It blocks a request that matches a known signature, such as a plain SQL injection, and can virtually patch a flaw while a fix is built. Encoded, smuggled, or fragmented payloads can slip past its rules and reach vulnerable code, so the WAF is a compensating control, not a substitute for secure code.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
