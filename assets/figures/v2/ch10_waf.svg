<rect width="1100" height="480" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">A web application firewall: a useful filter, not a fix</text>
<use href="#i-attacker" x="50.0" y="140.0" width="80" height="80"/><text x="90.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Client</text>
<use href="#i-firewall" x="380.0" y="130.0" width="100" height="100"/><text x="430.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">WAF</text><text x="430.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">rules and signatures</text>
