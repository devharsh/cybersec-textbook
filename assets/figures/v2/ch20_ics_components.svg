<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">ICS components, and how a compromised HMI deceives the operator</title><desc id="d">Field sensors and actuators connect to PLCs, which scan inputs, execute logic, and write outputs in milliseconds, often with no authentication. RTUs at remote sites report over a wide-area network to the SCADA server, and operators watch the HMI. A compromised HMI can show normal values while the process runs out of bounds, which is what Stuxnet did with centrifuge speeds.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
