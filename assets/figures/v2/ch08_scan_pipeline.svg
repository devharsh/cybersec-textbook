<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d"><title id="t">The scanning pipeline: each stage refines what the last one found</title><desc id="d">Seven stages left to right: host discovery finds live IP addresses; network mapping finds the routers and firewalls in between; port scanning finds open, closed, and filtered ports; fingerprinting infers the operating system; version scanning pins down the exact software; vulnerability scanning finds weaknesses; exploitation follows in Chapter 9. Time dominates: 65,536 ports at one second each on 500 hosts takes about 1.1 years.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
