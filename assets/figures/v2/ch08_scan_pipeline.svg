<g class="st s8"><text x="250.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Why time dominates planning:</text></g>
<g class="st s8"><text x="250.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">65,536 ports x 1 second x 500 hosts = 32,768,000 seconds = about 1.1 years (TCP alone)</text></g>
<g class="st s8"><text x="250.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">so testers prioritize ports, tune timing, and scan in stages.</text></g>
