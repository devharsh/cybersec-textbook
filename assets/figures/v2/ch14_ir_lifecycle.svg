<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d"><title id="t">The incident response lifecycle: six phases and a feedback loop</title><desc id="d">Preparation, identification, containment, eradication, recovery, and lessons learned, in a cycle. Lessons learned feeds back into preparation, so each incident makes the next response faster.</desc>
