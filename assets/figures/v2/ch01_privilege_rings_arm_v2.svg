<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-labelledby="t d"><title id="t">Arm exception levels and the TrustZone worlds</title><desc id="d">Two half rings. The normal world on the left: EL0 applications, EL1 a rich operating system such as Linux, and EL2 the hypervisor. The secure world on the right: S-EL0 trusted applications, S-EL1 the trusted operating system or TEE, and on newer cores S-EL2, which isolates secure partitions. At the center, EL3 runs firmware and the secure monitor, always in the secure state, the most privileged level and the gatekeeper between the two worlds. The secure world can reach both worlds&#x27; memory; the normal world reaches only its own.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
