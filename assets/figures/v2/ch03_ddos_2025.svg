<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Record DDoS attacks mitigated by Cloudflare during 2025 (as reported)</title><desc id="d">Bar chart of peak attack size in terabits per second: May 7.3, September 11.5, late September 22.2, fourth quarter 29.7, and the fourth-quarter peak 31.4. Each record stood for only weeks.</desc>
