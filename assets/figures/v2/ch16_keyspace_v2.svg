<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Each added key bit doubles the work: time to try every key at a trillion guesses a second</title><desc id="d">On a log scale of seconds: one-byte XOR, 2 to the 8 keys, about 0.26 nanoseconds; four-byte XOR, 2 to the 32, about 4.3 milliseconds; DES, 2 to the 56, about 20 hours; AES-128, 2 to the 128, about 1.1 times 10 to the 19 years; AES-256, 2 to the 256, about 3.7 times 10 to the 57 years. Reference lines mark one second and the 13.8-billion-year age of the universe.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
