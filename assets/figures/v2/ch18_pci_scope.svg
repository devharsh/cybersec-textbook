<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">PCI DSS scope: every system that touches card data is in the CDE, so touch less</title><desc id="d">Left: the merchant&#x27;s web store, application servers, database, and backups all store, process, or transmit card numbers, so all of them sit in the cardholder data environment and must meet every applicable requirement. Right: a tokenization provider takes the card number in a hosted field and returns a token; the merchant&#x27;s systems store only tokens, and the CDE shrinks to near zero. PCI DSS v4.0.1 has six objectives and twelve requirements.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
