<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Distributed denial of service: attack and defense</title><desc id="d">An attacker sends commands to a botnet of compromised laptops, phones, cameras, and servers. The bots flood the victim with traffic, so a legitimate user can be denied service. A scrubbing service with rate limiting absorbs and filters the flood, so only clean traffic reaches the victim server.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
