<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">DNS reconnaissance: records, zone transfers, and subdomains</title><desc id="d">A tester queries the target&#x27;s DNS with dig or nslookup and learns A, MX, NS, TXT, and other records. An authoritative server that allows zone transfers to anyone answers an AXFR request with every record in the zone, mapping the whole network; a correctly configured one transfers only to its authorized secondary. Subdomains also come from certificate-transparency logs, passive DNS databases, and brute-forcing names. Defenses: restrict zone transfers and sign records with DNSSEC.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
