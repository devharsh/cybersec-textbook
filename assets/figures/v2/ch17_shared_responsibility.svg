<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">The shared responsibility model: who secures which layer</title><desc id="d">Stacked layers from the bottom: physical data centers, hardware and network, and the hypervisor are the provider&#x27;s job. Above the line the customer secures network configuration, identity and access management, applications, and data. Misconfigurations on the customer side, such as public buckets, admin-level roles, open management ports, leaked secrets, and disabled logging, cause many cloud incidents.</desc>
