<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">NAT rewrites addresses; the protection people credit to it comes from filtering</title><desc id="d">Internal hosts 192.168.1.10 and 192.168.1.20 send traffic out. The NAT router rewrites each to the one public address 203.0.113.5 with a distinct port and records the mapping. Replies match a mapping and are translated back. An unsolicited inbound packet has no mapping and is dropped, which is filtering state, not translation. A static mapping of all ports to one host leaves that host as exposed as with no NAT at all.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
