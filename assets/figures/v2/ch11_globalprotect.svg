<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t d"><title id="t">When the firewall is the door: CVE-2024-3400 in PAN-OS GlobalProtect</title><desc id="d">An unauthenticated request to the GlobalProtect feature leads to arbitrary file creation, then OS command injection, then code execution as root on the firewall, and from there a pivot into the protected internal network. Rated CVSS 10.0 and exploited as a zero-day from late March 2024 in Operation MidnightEclipse.</desc>
