<g class="st s2"><circle cx="314" cy="72" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="314.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><path d="M532.0 170.0 L568.0 170.0" fill="none" stroke="#d9822b" stroke-width="3" marker-end="url(#a-d9822b)" stroke-linejoin="round"/></g>
<g class="st s3"><rect x="570" y="60" width="230" height="220" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2.2" filter="url(#f-drop)"/><rect x="570" y="60" width="230" height="8" rx="4" fill="#2e7d32"/><use href="#i-shield" x="645.0" y="74.0" width="80.0" height="80.0"/><text x="685.0" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" font-weight="bold" text-anchor="middle">Treat</text><text x="685.0" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">avoid, mitigate,</text><text x="685.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">transfer, accept</text></g>
<g class="st s3"><circle cx="584" cy="72" r="12" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text x="584.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M802.0 170.0 L838.0 170.0" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#a-2e7d32)" stroke-linejoin="round"/></g>
<g class="st s4"><rect x="840" y="60" width="230" height="220" rx="10" fill="#ffffff" stroke="#6a3d9a" stroke-width="2.2" filter="url(#f-drop)"/><rect x="840" y="60" width="230" height="8" rx="4" fill="#6a3d9a"/><use href="#i-eye" x="915.0" y="74.0" width="80.0" height="80.0"/><text x="955.0" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6a3d9a" font-weight="bold" text-anchor="middle">Monitor and review</text><text x="955.0" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">track residual risk,</text><text x="955.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">re-evaluate</text></g>
<g class="st s4"><circle cx="854" cy="72" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="854.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><path d="M955.0 282.0 L955.0 340.0 L145.0 340.0 L145.0 284.0" fill="none" stroke="#52606d" stroke-width="2.6" marker-end="url(#a-52606d)" stroke-linejoin="round"/><text x="551.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="bold" text-anchor="middle">conditions keep changing, so the loop repeats</text></g>
