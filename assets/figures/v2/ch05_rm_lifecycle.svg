<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t d"><title id="t">The risk-management lifecycle is a loop that never ends</title><desc id="d">Identify assets, threats, and vulnerabilities; assess likelihood times impact and prioritize; treat by avoiding, mitigating, transferring, or accepting; then monitor and review residual risk, which feeds the next round of identification.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
