<rect width="1100" height="400" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">The risk-management lifecycle is a loop that never ends</text>
<g class="st s1"><rect x="30" y="60" width="230" height="220" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2" filter="url(#f-drop)"/><rect x="30" y="60" width="230" height="8" rx="4" fill="#1f4e9c"/><use href="#i-search" x="105.0" y="74.0" width="80.0" height="80.0"/><text x="145.0" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f4e9c" font-weight="bold" text-anchor="middle">Identify</text><text x="145.0" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">assets, threats,</text><text x="145.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">vulnerabilities</text></g>
<g class="st s1"><circle cx="44" cy="72" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="44.0" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
