<g class="st s2"><circle cx="50" cy="250" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="50.0" y="254.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
