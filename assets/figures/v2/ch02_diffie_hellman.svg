<g class="st s1"><use href="#i-user2-phone" x="42.0" y="102.0" width="96" height="96"/><text x="90.0" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Alice</text></g>
