<g class="st s5"><rect x="810.0" y="390.0" width="260" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" filter="url(#f-drop)"/><text x="940.0" y="424.6" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">K = A^b mod p</text></g>
<g class="st s5"><text x="550.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" font-weight="bold" text-anchor="middle">same key: K = g^(ab) mod p</text></g>
<g class="st s5"><circle cx="30" cy="390" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="30.0" y="394.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<text x="550.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Unauthenticated DH is open to a man in the middle; TLS signs the exchange with the server&#x27;s certificate.</text>
</svg>