<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Diffie-Hellman: agreeing on a key over a public channel</title><desc id="d">Alice and Bob agree in public on a large prime p and a generator g. Alice picks a secret a and sends A = g to the a mod p; Bob picks a secret b and sends B = g to the b mod p. Eve sees p, g, A, and B. Each side combines the other&#x27;s public value with its own secret and gets the same key, g to the ab mod p, which Eve cannot compute without solving the discrete logarithm problem.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
