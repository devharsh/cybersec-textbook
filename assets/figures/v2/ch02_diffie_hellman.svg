<g class="st s3"><path d="M150.0 210.0 L950.0 210.0" fill="none" stroke="#1f4e9c" stroke-width="2.2" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="310.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="middle">A = g^a mod p</text></g>
<g class="st s3"><circle cx="170" cy="210" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="170.0" y="214.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M950.0 290.0 L150.0 290.0" fill="none" stroke="#1f4e9c" stroke-width="2.2" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="790.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="middle">B = g^b mod p</text></g>
<g class="st s4"><circle cx="930" cy="290" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="930.0" y="294.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s4"><text x="550.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle" font-style="italic">Eve sees p, g, A, and B, but not a or b</text></g>
