<rect width="1100" height="470" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Malware by how it spreads and what it does</text>
<g class="st s1"><rect x="30" y="60" width="330" height="180" rx="10" fill="#ffffff" stroke="#6a3d9a" stroke-width="2.2" filter="url(#f-drop)"/><rect x="30" y="60" width="330" height="8" rx="4" fill="#6a3d9a"/><use href="#i-document" x="160.0" y="74.0" width="70.0" height="70.0"/><text x="195.0" y="163.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6a3d9a" font-weight="bold" text-anchor="middle">Virus</text><text x="195.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">needs a host file;</text><text x="195.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">spreads when run</text></g>
<g class="st s1"><circle cx="44" cy="80" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="44.0" y="84.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><rect x="385" y="60" width="330" height="180" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2" filter="url(#f-drop)"/><rect x="385" y="60" width="330" height="8" rx="4" fill="#c0392b"/><use href="#i-nodes" x="515.0" y="74.0" width="70.0" height="70.0"/><text x="550.0" y="163.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="middle">Worm</text><text x="550.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">spreads by itself;</text><text x="550.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">WannaCry, EternalBlue</text></g>
<g class="st s2"><circle cx="399" cy="80" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="399.0" y="84.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><rect x="740" y="60" width="330" height="180" rx="10" fill="#ffffff" stroke="#d9822b" stroke-width="2.2" filter="url(#f-drop)"/><rect x="740" y="60" width="330" height="8" rx="4" fill="#d9822b"/><use href="#i-certificate" x="870.0" y="74.0" width="70.0" height="70.0"/><text x="905.0" y="163.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#d9822b" font-weight="bold" text-anchor="middle">Trojan / RAT</text><text x="905.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">looks legitimate;</text><text x="905.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">RAT adds remote control</text></g>
<g class="st s3"><circle cx="754" cy="80" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="754.0" y="84.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><rect x="30" y="260" width="330" height="180" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2" filter="url(#f-drop)"/><rect x="30" y="260" width="330" height="8" rx="4" fill="#c0392b"/><use href="#i-lock" x="160.0" y="274.0" width="70.0" height="70.0"/><text x="195.0" y="363.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="middle">Ransomware</text><text x="195.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">encrypts, often steals</text><text x="195.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">first: double extortion</text></g>
<g class="st s4"><circle cx="44" cy="280" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="44.0" y="284.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><rect x="385" y="260" width="330" height="180" rx="10" fill="#ffffff" stroke="#2b3138" stroke-width="2.2" filter="url(#f-drop)"/><rect x="385" y="260" width="330" height="8" rx="4" fill="#2b3138"/><use href="#i-eye" x="515.0" y="274.0" width="70.0" height="70.0"/><text x="550.0" y="363.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2b3138" font-weight="bold" text-anchor="middle">Rootkit</text><text x="550.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">hides files, processes,</text><text x="550.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">connections from the OS</text></g>
<g class="st s5"><circle cx="399" cy="280" r="12" fill="#2b3138" stroke="#fff" stroke-width="2"/><text x="399.0" y="284.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s6"><rect x="740" y="260" width="330" height="180" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2" filter="url(#f-drop)"/><rect x="740" y="260" width="330" height="8" rx="4" fill="#1f4e9c"/><use href="#i-bot" x="870.0" y="274.0" width="70.0" height="70.0"/><text x="905.0" y="363.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f4e9c" font-weight="bold" text-anchor="middle">Botnet</text><text x="905.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">many machines under</text><text x="905.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">one C2: DDoS, spam</text></g>
<g class="st s6"><circle cx="754" cy="280" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="754.0" y="284.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text></g>
