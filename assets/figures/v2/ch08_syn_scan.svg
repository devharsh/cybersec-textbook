<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Reading a SYN scan: open, closed, or filtered</title><desc id="d">Open: the scanner sends SYN, the target answers SYN-ACK, and the scanner sends RST instead of completing the handshake. Closed: the target answers RST. Filtered: a firewall drops the probe, so there is no response, or an ICMP unreachable comes back. A connect scan completes the full handshake, needs no privileges, and is far more likely to be logged.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
