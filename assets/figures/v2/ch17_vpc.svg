<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">A VPC with public and private subnets, and a VPN back to the office</title><desc id="d">Inside a VPC with address range 10.0.0.0/16, the public subnet holds the load balancer and a bastion host and reaches the internet through the internet gateway. The private subnet holds the application and database, which accept no inbound traffic from the internet. The on-premises network connects over a site-to-site VPN to a virtual private gateway.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
