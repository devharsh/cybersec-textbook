<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Three ways to turn raw data into an alert, and the analyst loop that improves them</title><desc id="d">Raw data such as emails, files, logs, and flows feeds pattern matching with signatures, regular expressions, and YARA; machine learning, which turns features into a model and a prediction; and deep learning, where a neural network learns its own features. All three raise an alert or a classification for analyst triage, and the analyst&#x27;s feedback updates rules and retrains models.</desc>
