<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Harvest now, decrypt later: today&#x27;s traffic, tomorrow&#x27;s quantum computer</title><desc id="d">Today an adversary records encrypted traffic protected by RSA or ECC key exchange and stores it. Years later, a large fault-tolerant quantum computer running Shor&#x27;s algorithm breaks the key exchange, and the stored traffic is read. Secrets that stay sensitive for 10 to 15 years, such as state secrets, health data, and legal records, are at risk now, which is why migration to ML-KEM, ML-DSA, and SLH-DSA starts before quantum computers arrive.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
