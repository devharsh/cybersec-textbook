<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Order of volatility: collect what disappears first</title><desc id="d">A staircase from most to least volatile: CPU registers and cache; RAM with processes, network connections, and keys; disk, swap, and the hibernation file; remote logs and monitoring data; physical configuration and network topology; and archival media and backups. Collect from the top down, because a reboot erases the first two in an instant.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
