<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">The CSIRT: an incident commander, a cross-functional team, and planned communication</title><desc id="d">The incident commander runs the response with technical responders, legal, communications and PR, human resources, and executive leadership, organized with a RACI chart. Communication goes out of band, because the attacker may be reading corporate email, to customers, regulators, law enforcement, and the public. Notification clocks such as GDPR&#x27;s 72 hours start during the incident, so counsel joins early.</desc>
