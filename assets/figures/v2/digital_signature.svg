<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d"><title id="t">Digital signature: sign with the private key, verify with the public key</title><desc id="d">Alice signs message m with her private key to make signature s and sends m and s. Mallory in the network can change them but cannot forge a valid pair. Bob verifies with Alice&#x27;s public key: an unchanged pair is accepted, a changed pair is rejected. The roles of the keys are the reverse of encryption.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
