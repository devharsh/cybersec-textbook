<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Hats describe authorization and intent; team colors describe roles in an exercise</title><desc id="d">Left: white hats are authorized and aim to improve security; gray hats often mean no harm but act without full authorization, which is still illegal; black hats act without authorization and with malicious intent. Right: the red team emulates attackers, the blue team defends with monitoring, detection, and response, and purple teaming is a way of working in which red and blue share techniques so detection improves at once.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
