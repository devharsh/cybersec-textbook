<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d"><title id="t">The cyber kill chain: break any stage, and earlier is cheaper</title><desc id="d">Seven stages left to right with icons: reconnaissance, weaponization, delivery, exploitation, installation, command and control, and actions on objectives. Breaking any stage ends the attempt. Detection at reconnaissance costs little; detection at actions on objectives means loss has already happened. Real intrusions loop and skip, which is why ATT&amp;CK is a matrix.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}.s9{animation-delay:7.20s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
