<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d"><title id="t">A 5 by 5 qualitative risk matrix: score = likelihood rank times impact rank</title><desc id="d">Likelihood from Rare to Almost certain on the vertical axis and impact from Negligible to Severe on the horizontal axis. Each cell holds the product of the two ranks, from 1 to 25. Scores up to 4 are green and can be accepted, 5 to 9 are yellow, 10 to 14 are orange, and 15 and above are red and urgent.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
