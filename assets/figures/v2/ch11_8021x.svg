<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">802.1X: the switch admits only authentication traffic until the device is verified</title><desc id="d">A laptop, the supplicant, plugs into a switch port, the authenticator. The switch blocks everything except EAP frames and relays the device&#x27;s credentials to a RADIUS authentication server. If the server accepts and the health check passes, the switch opens the port onto the user VLAN; a non-compliant device is placed in a remediation VLAN that can reach only update servers.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
