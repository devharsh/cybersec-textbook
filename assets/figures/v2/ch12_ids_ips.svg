<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Where detection sits: an IDS watches a copy, an IPS sits in the path, a HIDS lives on the host</title><desc id="d">Traffic from the internet passes the firewall and an inline IPS, which drops or resets packets that match a rule and forwards clean ones, at the cost of latency and a possible failure point. A tap or SPAN port on the core switch gives a passive IDS a copy of the traffic; it can only alert. Host-based agents on servers watch the host itself. Alerts from all of them go to the SIEM and the analyst.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
