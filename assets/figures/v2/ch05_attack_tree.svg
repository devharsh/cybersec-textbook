<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">An attack tree: one goal, several paths to it</title><desc id="d">The root goal is to steal customer data. It branches into compromising the web app, by SQL injection or by exploiting an unpatched component; compromising the database directly through an exposed port or weak credentials; or phishing an administrator, by a spear-phishing email or by vishing the help desk.</desc>
