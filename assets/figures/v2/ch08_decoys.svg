<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Decoy scanning: hiding the real scanner among spoofed sources</title><desc id="d">With nmap -D the real scanner&#x27;s probes are mixed with probes that appear to come from several spoofed decoy addresses, so the intrusion detection system logs many sources and cannot easily tell which is real. Other evasion tricks are fragmentation, source-port and timing changes, bad checksums to spot firewalls, and IPv6. Defenses: rate-limit and correlate, alert on illegal flags, reassemble fragments, validate checksums, and police IPv6 like IPv4.</desc>
