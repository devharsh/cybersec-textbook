<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-labelledby="t d"><title id="t">Bell-LaPadula protects confidentiality; Biba protects integrity</title><desc id="d">Left, Bell-LaPadula with levels Top Secret, Secret, and Unclassified and a subject cleared for Secret: it may read down but not up (no read up), and write up but not down (no write down). Right, Biba with high, medium, and low integrity and a medium-integrity subject: it may read up but not down (no read down), and write down but not up (no write up).</desc>
