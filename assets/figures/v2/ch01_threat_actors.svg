<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-labelledby="t d"><title id="t">Threat actors, from least to most capable</title><desc id="d">Five kinds of threat actor in order of capability and resources: script kiddies who run published tools for curiosity or bragging rights; hacktivists who attack for a political or social cause; cybercriminals who attack for money; insiders who misuse legitimate access, by malice or mistake; and advanced persistent threats, usually state-backed, who pursue long-term espionage or sabotage. A credible threat needs capability, intent, and opportunity.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
