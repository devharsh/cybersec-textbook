<g class="st s7"><text x="100.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">details by calling a known number.</text></g>
<g class="st s7"><text x="100.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start" font-style="italic">Nothing malicious ran on any endpoint, which is why malware-focused defenses miss BEC.</text></g>
