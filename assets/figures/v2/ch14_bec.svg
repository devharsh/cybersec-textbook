<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Business email compromise: no malware, just a mailbox and a changed bank account</title><desc id="d">An accounts-payable clerk enters credentials on a lookalike Microsoft 365 login page; with no MFA the attacker logs in, reads the mailbox for days, and adds an inbox rule that forwards and deletes messages containing invoice or payment. Posing as a known vendor from a lookalike domain, the attacker sends an invoice with new bank details, and the clerk wires a large sum. Response: revoke sessions, reset the password with MFA, remove the rule, and call the bank and law enforcement at once, which recovered part of the funds. Fixes: MFA, block external auto-forwarding, and verify payment changes by phone.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
