<g class="st s7"><text x="100.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">Contain: revoke sessions and tokens, reset the password with MFA enrollment, remove the inbox rule.</text></g>
