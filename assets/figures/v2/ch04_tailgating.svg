<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">Tailgating, and the mantrap that stops it</title><desc id="d">Left: an employee badges in and opens the door; an outsider slips through behind before it closes. Right: a mantrap, or access-control vestibule, has two interlocking doors; the inner door opens only after the outer door has closed and one person has been verified, so only one person passes at a time.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
