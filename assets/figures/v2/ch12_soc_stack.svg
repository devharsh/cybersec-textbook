<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">A modern SOC: EDR on the hosts, XDR across layers, SOAR for the routine, detections as code</title><desc id="d">EDR agents on endpoints record processes, files, registry, and network activity and can isolate a machine. XDR correlates endpoint, network, identity, email, and cloud signals into one incident. SOAR playbooks enrich indicators, open tickets, and take pre-approved containment steps. Detection engineers write rules as code, often in Sigma, map them to ATT&amp;CK, and tune them, which feeds back into every layer.</desc>
