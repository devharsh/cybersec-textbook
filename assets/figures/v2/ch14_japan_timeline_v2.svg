<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d"><title id="t">Japan, October 2026: from a breach wave to a national response</title><desc id="d">October 1: Active Cyber Defense powers and reporting take effect. October 7: IDC Frontier ransomware reported, affecting 495 companies and local governments. October 9: National Cybersecurity Office advisory, and an LDP official calls it an emergency in cyberspace. October 20: LDP emergency proposals for a headquarters under the Prime Minister&#x27;s office. October 23: the Prime Minister names the National Cybersecurity Office the command center. October 24: GMO asks for active cyber defense; up to 26,739 servers may be affected. October 26: the Prime Minister orders emergency measures by the end of the next week.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
