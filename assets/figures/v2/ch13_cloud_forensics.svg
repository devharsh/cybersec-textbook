<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Cloud forensics: snapshots and audit logs instead of a seized disk</title><desc id="d">In the cloud the investigator cannot seize hardware. Volatile state is captured before an instance is terminated, the virtual disk is snapshotted and copied to a separate, access-controlled forensic account, and the audit logs, AWS CloudTrail, Azure Activity Logs with Entra sign-in logs, or Google Cloud Audit Logs, show which API calls were made, by whom, when, and from where. Challenges: shared responsibility, multi-tenancy, data residency, and short-lived resources.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
