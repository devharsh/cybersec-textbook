<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" width="860" height="720" role="img" aria-labelledby="t d"><title id="t">Parkerian hexad: six attributes of information security</title><desc id="d">Six attributes arranged around a hexagon: confidentiality, possession or control, integrity, authenticity, availability, and utility. Donn Parker added possession, authenticity, and utility to the CIA triad.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
