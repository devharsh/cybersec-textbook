<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">The policy hierarchy: why, what exactly, in what flow, how step by step, and what is advised</title><desc id="d">A pyramid. Policy at the top states management&#x27;s intent and why, technology-neutral and long-lived. A standard sets specific, mandatory, measurable requirements, such as AES-256-GCM for Confidential data. A process sets the flow of work: activities, order, owners, inputs, and outputs. A procedure gives the exact steps. Beside it, a guideline offers recommended but optional practice. Higher levels change slowly; lower levels change often.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
