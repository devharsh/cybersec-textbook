<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">IoT: devices that are hard to patch, and what happens when thousands fall at once</title><desc id="d">Cameras, thermostats, medical devices, and industrial sensors often run embedded Linux or an RTOS with no patch mechanism, keep default credentials, have no screen or keyboard for security settings, and stay in service for 10 to 20 years. In 2016 the Mirai botnet logged into such devices with default passwords and used them in a DDoS of about 600 Gbps peak against Dyn DNS, disrupting major internet services. Consequences range from nuisance to physical harm.</desc>
