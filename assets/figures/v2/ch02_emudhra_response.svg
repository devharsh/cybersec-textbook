<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="t d"><title id="t">Distrusting a certificate authority: the eMudhra emSign G3 response, October 2026</title><desc id="d">A root certificate, emSign ECC Root CA - G3, cross-signs TLS and code-signing sub-roots. Under it, eight weak P-384 intermediates, six TLS and two code signing, issued no customer certificates, while sibling intermediates under the same root carry about 30,800 unexpired precertificates that had to move. The response runs from narrowest to widest: one, revocation by the CA on October 18; two, browser blocklists on October 17 and 20; three, root removal announced October 20; four, collateral as customers migrate and eMudhra exits the TLS business on October 22.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
