<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Two ways an AI agent can reach a bank account</title><desc id="d">The customer asks an AI agent to act. Upper path: the customer shares the password, the agent logs in as the customer, and the bank sees the customer with full read and write and cannot reliably tell the agent from the user. Lower path: the customer grants consent, the agent gets a delegated token that is named, scoped, and revocable, and the bank sees this agent with read-only access or payments with approval, cut off by revoking. A hidden instruction in a web page or email can steer either agent; only the lower path limits what the agent can then do.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
