<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Same look, different promises: two questions sort every scrambled string</title><desc id="d">A scrambled string goes to question 1: is it meant to be undone without a secret? If yes, it is encoding: Base64 and ROT13. If no, question 2: can the right key undo it? If yes, it is encryption: one-byte XOR with 256 keys, tried at once, and AES-128 with 2 to the 128 keys, no way to try them all. If no, never, it is hashing: SHA-256, always 256 bits, check it, never undo it.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
