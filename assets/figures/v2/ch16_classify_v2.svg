<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Same look, different promises: two questions sort every scrambled string</text>
<use href="#i-document" x="50.0" y="210.0" width="80" height="80"/><text x="90.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">A scrambled string</text>
<text x="90.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">looks the same either way</text>
