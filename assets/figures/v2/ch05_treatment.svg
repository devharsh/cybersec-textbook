<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Four ways to treat a risk, shown with a bicycle and with a data breach</title><desc id="d">Mitigate: a good lock lowers the chance of theft, like a security control. Transfer: insurance moves the financial loss to someone else but prevents nothing, like cyber insurance. Accept: decide in writing to live with scratches, like a documented risk acceptance within appetite. Avoid: do not ride in heavy traffic, like not collecting data you do not need. Real plans combine all four.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
