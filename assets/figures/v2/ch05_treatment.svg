<rect x="22" y="12" width="58" height="78" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="1.4"/>
<rect x="28" y="16" width="50" height="70" rx="2" fill="url(#g-paper)"/>
<line x1="34" y1="26" x2="72" y2="26" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="35" x2="72" y2="35" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="44" x2="72" y2="44" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="53" x2="72" y2="53" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="62" x2="72" y2="62" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="71" x2="72" y2="71" stroke="#9aa6b3" stroke-width="2.2"/><line x1="34" y1="80" x2="72" y2="80" stroke="#9aa6b3" stroke-width="2.2"/>
<g fill="#6b7785" font-family="Courier, monospace" font-size="6"><text x="34" y="24">09:14</text><text x="34" y="33">09:15</text></g>
</symbol>
