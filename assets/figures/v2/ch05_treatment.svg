<g stroke="#9aa6b3" stroke-width="2.2" stroke-linecap="round"><line x1="24" y1="32" x2="62" y2="32"/><line x1="24" y1="41" x2="56" y2="41"/><line x1="24" y1="50" x2="50" y2="50"/></g>
