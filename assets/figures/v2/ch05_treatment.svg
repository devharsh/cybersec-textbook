<path d="M35 35 L65 65 M65 35 L35 65" stroke="#fff" stroke-width="9" stroke-linecap="round"/></symbol>
</defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Four ways to treat a risk, shown with a bicycle and with a data breach</text>
<g class="st s1"><rect x="30.0" y="50.0" width="510.0" height="180.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#1f4e9c" stroke-width="2.4"/></g>
<g class="st s1"><rect x="30.0" y="50.0" width="510.0" height="8.0" rx="4" fill="#1f4e9c" fill-opacity="1" stroke="#1f4e9c" stroke-width="1"/></g>
<g class="st s1"><use href="#i-lock" x="55.0" y="97.0" width="90" height="90"/></g>
<g class="st s1"><text x="170.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f4e9c" font-weight="bold" text-anchor="start">Mitigate</text></g>
<g class="st s1"><text x="170.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Bicycle: a good lock</text></g>
<g class="st s1"><text x="170.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Data: encryption, MFA, patching</text></g>
<g class="st s1"><text x="170.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">lowers likelihood or impact</text></g>
<g class="st s1"><circle cx="522" cy="70" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="522.0" y="74.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><rect x="560.0" y="50.0" width="510.0" height="180.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#d9822b" stroke-width="2.4"/></g>
<g class="st s2"><rect x="560.0" y="50.0" width="510.0" height="8.0" rx="4" fill="#d9822b" fill-opacity="1" stroke="#d9822b" stroke-width="1"/></g>
<g class="st s2"><use href="#i-certificate" x="585.0" y="97.0" width="90" height="90"/></g>
<g class="st s2"><text x="700.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#d9822b" font-weight="bold" text-anchor="start">Transfer</text></g>
<g class="st s2"><text x="700.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Bicycle: theft insurance</text></g>
<g class="st s2"><text x="700.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Data: cyber insurance, outsourcing</text></g>
<g class="st s2"><text x="700.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">moves the money, not the risk</text></g>
<g class="st s2"><circle cx="1052" cy="70" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="1052.0" y="74.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><rect x="30.0" y="250.0" width="510.0" height="180.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#6a3d9a" stroke-width="2.4"/></g>
<g class="st s3"><rect x="30.0" y="250.0" width="510.0" height="8.0" rx="4" fill="#6a3d9a" fill-opacity="1" stroke="#6a3d9a" stroke-width="1"/></g>
<g class="st s3"><use href="#i-logbook" x="55.0" y="297.0" width="90" height="90"/></g>
<g class="st s3"><text x="170.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6a3d9a" font-weight="bold" text-anchor="start">Accept</text></g>
<g class="st s3"><text x="170.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Bicycle: live with scratches</text></g>
<g class="st s3"><text x="170.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Data: signed acceptance in the register</text></g>
<g class="st s3"><text x="170.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">only if documented and within appetite</text></g>
<g class="st s3"><circle cx="522" cy="270" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="522.0" y="274.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><rect x="560.0" y="250.0" width="510.0" height="180.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#c0392b" stroke-width="2.4"/></g>
<g class="st s4"><rect x="560.0" y="250.0" width="510.0" height="8.0" rx="4" fill="#c0392b" fill-opacity="1" stroke="#c0392b" stroke-width="1"/></g>
<g class="st s4"><use href="#i-cross" x="585.0" y="297.0" width="90" height="90"/></g>
<g class="st s4"><text x="700.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c0392b" font-weight="bold" text-anchor="start">Avoid</text></g>
<g class="st s4"><text x="700.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Bicycle: skip the busy street</text></g>
<g class="st s4"><text x="700.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Data: do not collect what you do not need</text></g>
<g class="st s4"><text x="700.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">also gives up the benefit</text></g>
<g class="st s4"><circle cx="1052" cy="270" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="1052.0" y="274.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><text x="550.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">A real plan mixes them: lock the bike, insure it, accept the scratches, and avoid one street after dark.</text></g>
<g class="st s5"><text x="550.0" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Insurance never transfers the loss of trust, and legal accountability usually stays with the organization.</text></g>
<g class="st s5"><circle cx="90" cy="470" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="90.0" y="474.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
</svg>