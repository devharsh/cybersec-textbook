<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Three ways malware reaches many machines at once</title><desc id="d">A worm spreads from host to host on its own by exploiting a vulnerability, like WannaCry over SMB; patching and segmentation set its blast radius. A botnet is many compromised machines under one command-and-control server, rented out for DDoS, spam, and credential stuffing. Supply-chain malware rides a trusted, signed update to thousands of customers, as with SolarWinds.</desc>
