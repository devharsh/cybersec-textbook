<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">Traceroute uses TTL to make each router reveal itself; firewalking reuses the trick</title><desc id="d">The scanner sends a probe with TTL 1; the first router decrements it to zero and returns ICMP time exceeded. TTL 2 is answered by the second router, and TTL 3 reaches the target, which returns an echo reply. Firewalking sets the TTL one hop beyond the firewall: if a time-exceeded message comes back from the next hop, the firewall allowed that port.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
