<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">One ALE number hides the bad years: 20,000 simulated years of loss</title><desc id="d">A Monte Carlo simulation of 20,000 years. In 11,771 years, about 59%, no loss event happens at all. The other years form a long right tail of losses from about 50,000 to 2.6 million dollars. The mean annual loss, the ALE, is about 260 thousand dollars, but one year in twenty loses more than 1,041 thousand.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
