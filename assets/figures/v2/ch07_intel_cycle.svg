<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d"><title id="t">The intelligence cycle turns raw collection into a usable footprint</title><desc id="d">Five stages in a loop: planning and direction sets the questions from the scope; collection gathers raw data from OSINT, registries, DNS, and cloud sources; processing deduplicates hosts and resolves names; analysis correlates people, technology, and exposed hosts, often in a link-analysis tool; dissemination records a structured footprint that drives scanning and the report, and raises new questions.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
