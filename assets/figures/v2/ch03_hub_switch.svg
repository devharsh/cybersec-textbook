<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d"><title id="t">Why sniffing a switch takes work: hub, switch, and MAC flooding</title><desc id="d">With a hub, a frame from A to B is repeated to every port, so the attacker in promiscuous mode sees it. A switch looks up B in its CAM table and sends the frame only to B&#x27;s port, so the attacker sees nothing. In MAC flooding the attacker fills the CAM table with fake source addresses; many switches then fail open and flood every frame to every port like a hub.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
