<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Coverage-guided fuzzing: mutate, run, keep what reaches new code</title><desc id="d">Seed inputs form a corpus. The fuzzer picks one, mutates it, and runs the instrumented target built with sanitizers such as AddressSanitizer. If the input reached new code, it joins the corpus; if the target crashed, the input is saved for triage. The loop repeats millions of times, steering toward unexplored paths. AFL++ and libFuzzer work this way.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
