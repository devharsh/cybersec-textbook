<g class="st s5"><path d="M124.0 468.0 L976.0 468.0" fill="none" stroke="#2e7d32" stroke-width="2.6" marker-start="url(#a-2e7d32)" marker-end="url(#a-2e7d32)" stroke-linejoin="round"/><text x="550.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="middle">application data, both directions</text></g>
