<g class="st s1"><path d="M124.0 190.0 L976.0 190.0" fill="none" stroke="#1f4e9c" stroke-width="2.6" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="550.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e9c" font-weight="bold" text-anchor="middle">ClientHello: cipher suites, key share (X25519 + ML-KEM)</text></g>
