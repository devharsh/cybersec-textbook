<text x="550.0" y="545.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">The client checks the certificate chain and the CertificateVerify signature; keys from the ephemeral exchange give forward secrecy.</text>
