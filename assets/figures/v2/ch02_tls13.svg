<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">The TLS 1.3 handshake: one round trip to an encrypted channel</title><desc id="d">The client sends ClientHello with supported cipher suites and a key share. The server answers with ServerHello and its key share; both now derive handshake keys. Still in the same flight, the server sends, encrypted, its certificate, a CertificateVerify signature over the handshake, and Finished. The client checks the certificate chain and signature, sends Finished, and application data flows under keys from the ephemeral exchange.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
