<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">A remote-access VPN, and what split tunneling leaves out</title><desc id="d">Full tunnel: the laptop encrypts all traffic in an IPsec or WireGuard tunnel across the internet to the corporate VPN gateway, so corporate traffic and web traffic both pass the corporate security stack. Split tunnel: only corporate traffic uses the tunnel and web traffic goes straight to the internet, so malware talking to its C2 server is never seen by the corporate stack.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
