<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d"><title id="t">A water treatment plant partitioned into IEC 62443 zones and conduits</title><desc id="d">Five zones: the enterprise zone with resource planning and the office network at SL-T 1; the industrial DMZ with a historian replica and remote access broker at SL-T 2; the plant control zone with the SCADA server, consoles, and controllers inside the fence at SL-T 3; the safety zone with chlorine interlocks, physically separate, at SL-T 3; and the remote station zone with three pump stations over cellular links at SL-T 3. Conduits: a brokered session to a jump host only, from enterprise to DMZ; historian data outbound only, from plant control to DMZ; an engineering path only with procedure and key switch, between safety and plant control; and one polling protocol, one port, one direction, from remote stations to plant control.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}.s9{animation-delay:7.20s}.s10{animation-delay:8.10s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
