<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Two ways out of a VLAN: switch spoofing and double tagging</title><desc id="d">Left: with Dynamic Trunking Protocol, an attacker&#x27;s port set to dynamic desirable or auto agrees to become a trunk, and every permitted VLAN arrives at the attacker tagged and readable. Right: an attacker in the native VLAN 1 sends a frame with an outer tag for VLAN 1 and an inner tag for VLAN 140; switch 1 strips the outer tag as native and forwards it on the trunk; switch 2 reads VLAN 140 and delivers it. Double tagging is one-way. Fixes: switchport nonegotiate, an unused native VLAN, an allowed list, and tagging the native VLAN.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
