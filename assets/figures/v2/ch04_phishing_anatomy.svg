<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d"><title id="t">Reading a phishing email: six tells, one habit</title><desc id="d">A mock email claiming to be from IT support. Callouts mark the tells: a look-alike sender domain, urgency and fear, a request for credentials, a link whose real destination differs when hovered, an unexpected attachment, and sloppy wording. The habit: verify through an independent channel, the known website or published phone number.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
