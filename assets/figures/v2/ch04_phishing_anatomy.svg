<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Reading a phishing email: six tells, one habit</text>
<rect x="40.0" y="60.0" width="640.0" height="470.0" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.6"/>
<rect x="40.0" y="60.0" width="640.0" height="40.0" rx="8" fill="#e9edf2" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.6"/>
<circle cx="62" cy="80" r="6" fill="#e74c3c" fill-opacity="1" stroke="#e74c3c" stroke-width="1"/>
<circle cx="80" cy="80" r="6" fill="#f5b041" fill-opacity="1" stroke="#f5b041" stroke-width="1"/>
<circle cx="98" cy="80" r="6" fill="#8fd16a" fill-opacity="1" stroke="#8fd16a" stroke-width="1"/>
<text x="360.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="middle">Inbox</text>
<text x="60.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">From:  IT Support &lt;helpdesk@micros0ft-support.co&gt;</text>
<text x="60.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Subject:  URGENT: your mailbox will be deleted in 1 hour</text>
<line x1="60" y1="172" x2="660" y2="172" stroke="#d0d6dd"/>
<text x="60.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">Dear user,</text>
<text x="60.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">We detected unusual activity. Your mailbox will be deleted today</text>
<text x="60.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">unless you verify you&#x27;re password now.</text>
<g class="st s3"><line x1="170" y1="263" x2="214" y2="263" stroke="#c0392b" stroke-width="2"/></g>
<rect x="60.0" y="284.0" width="260.0" height="40.0" rx="6" fill="#1f4e9c" fill-opacity="1" stroke="#1f4e9c" stroke-width="1"/>
<text x="190.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Verify my account</text>
<rect x="60.0" y="336.0" width="470.0" height="26.0" rx="4" fill="#fff8e1" fill-opacity="1" stroke="#d9a400" stroke-width="1"/>
<text x="70.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a6d1a" font-weight="normal" text-anchor="start">hover: http://login.micros0ft-support.co/verify?u=</text>
<use href="#i-document" x="65.0" y="385.0" width="50" height="50"/>
<text x="124.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Invoice_2026.pdf.exe</text>
<text x="60.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="start">Thank you, IT Support Team</text>
<g class="st s1"><path d="M752.0 116.0 L420.0 125.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s1"><circle cx="766" cy="116" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="120.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s1"><text x="784.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Look-alike sender domain:</text><text x="784.0" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">micros0ft with a zero</text></g>
<g class="st s2"><path d="M752.0 186.0 L474.0 151.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s2"><circle cx="766" cy="186" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="190.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s2"><text x="784.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Urgency and fear:</text><text x="784.0" y="197.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">deleted in 1 hour</text></g>
<g class="st s3"><path d="M752.0 256.0 L228.0 266.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s3"><circle cx="766" cy="256" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="260.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s3"><text x="784.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Sloppy wording:</text><text x="784.0" y="267.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">you&#x27;re for your</text></g>
<g class="st s4"><path d="M752.0 336.0 L336.0 304.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s4"><circle cx="766" cy="336" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="340.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s4"><text x="784.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Asks for credentials, which</text><text x="784.0" y="347.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">real IT never does by email</text></g>
<g class="st s5"><path d="M752.0 406.0 L550.0 349.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s5"><circle cx="766" cy="406" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="410.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s5"><text x="784.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Link text and real</text><text x="784.0" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">destination differ</text></g>
<g class="st s6"><path d="M752.0 476.0 L274.0 411.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s6"><circle cx="766" cy="476" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="766.0" y="480.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text></g>
<g class="st s6"><text x="784.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Unexpected attachment with</text><text x="784.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">a double extension</text></g>
<g class="st s7"><use href="#i-shield" x="704.0" y="536.0" width="40" height="40"/></g>
<g class="st s7"><circle cx="700" cy="540" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="700.0" y="544.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">7</text></g>
<g class="st s7"><text x="750.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">Slow down. Verify through a separate channel:</text></g>
<g class="st s7"><text x="750.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">type the known URL or call the published number.</text></g>
