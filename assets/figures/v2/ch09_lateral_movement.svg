<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Lateral movement: reusing what was found on one host to reach the next</title><desc id="d">The attacker controls one workstation and dumps credentials from LSASS memory or the SAM with Mimikatz. Pass-the-hash presents the NTLM hash itself to other machines, with no cracking. Pass-the-ticket injects a captured or forged Kerberos ticket; a golden ticket, signed with the krbtgt hash, opens any service in the domain. Defenses: Credential Guard, disabling NTLM where possible, tiered administration, and rotating krbtgt twice after a compromise.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
