<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Supply-chain risk: one trusted update can reach thousands of customers</title><desc id="d">A vendor&#x27;s developers and open-source dependencies feed a build pipeline that produces a signed update. If an attacker compromises the build system, as in SolarWinds, the malicious code is signed and shipped to thousands of customers who trust the vendor. Controls: assess vendors with SOC 2 or ISO/IEC 27001 evidence, put security and audit rights in contracts, keep a software bill of materials, verify the integrity and provenance of updates, secure the build pipeline, and monitor vendors over time.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
