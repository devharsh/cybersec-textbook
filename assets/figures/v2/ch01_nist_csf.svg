<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="t d"><title id="t">NIST Cybersecurity Framework 2.0: six functions</title><desc id="d">Govern sits at the center and informs the five other functions arranged around it: Identify, Protect, Detect, Respond, and Recover. CSF 2.0, published in 2024, added Govern to the original five.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
