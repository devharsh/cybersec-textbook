<rect width="1120" height="560" fill="#ffffff"/>
<text x="560.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Kerberos in three exchanges: the password never crosses the network</text>
<use href="#i-desktop" x="60.0" y="230.0" width="120" height="120"/><text x="120.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Client</text><text x="120.0" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">user signs in</text>
<line x1="236" y1="96" x2="236" y2="500" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
<rect x="760" y="54" width="340" height="312" rx="14" fill="#eef5fc" stroke="#2f6fae" stroke-width="2"/><text x="774.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fae" font-weight="bold" text-anchor="start">Key Distribution Center</text>
<text x="1084.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6fae" font-weight="normal" text-anchor="end">on the domain controller</text>
<use href="#i-server" x="858.0" y="104.0" width="84" height="84"/>
<text x="968.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">AS</text>
<text x="968.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">Authentication Server</text>
<g class="st s1"><path d="M240.0 134.0 L852.0 134.0" fill="none" stroke="#1f4e9c" stroke-width="2.2" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="546.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e9c" font-weight="bold" text-anchor="middle">AS-REQ: timestamp encrypted with the password-derived key</text></g>
<g class="st s1"><circle cx="262" cy="134" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="262.0" y="138.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><path d="M852.0 166.0 L240.0 166.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a-c0392b)" stroke-linejoin="round"/><text x="546.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">AS-REP: Ticket-Granting Ticket (TGT), encrypted with the krbtgt key</text></g>
<g class="st s2"><circle cx="830" cy="166" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="830.0" y="170.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<use href="#i-server" x="858.0" y="254.0" width="84" height="84"/>
<text x="968.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">TGS</text>
<text x="968.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">Ticket-Granting Server</text>
<g class="st s3"><path d="M240.0 284.0 L852.0 284.0" fill="none" stroke="#1f4e9c" stroke-width="2.2" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="546.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e9c" font-weight="bold" text-anchor="middle">TGS-REQ: TGT + the service it wants (SPN)</text></g>
<g class="st s3"><circle cx="262" cy="284" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="262.0" y="288.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M852.0 316.0 L240.0 316.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a-c0392b)" stroke-linejoin="round"/><text x="546.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">TGS-REP: service ticket, encrypted with the service account key</text></g>
<g class="st s4"><circle cx="830" cy="316" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="830.0" y="320.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<use href="#i-server" x="858.0" y="406.0" width="84" height="84"/>
<text x="968.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Service</text>
<text x="968.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">file server</text>
<g class="st s5"><path d="M240.0 436.0 L852.0 436.0" fill="none" stroke="#1f4e9c" stroke-width="2.2" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/><text x="546.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e9c" font-weight="bold" text-anchor="middle">AP-REQ: service ticket</text></g>
<g class="st s5"><circle cx="262" cy="436" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="262.0" y="440.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s6"><path d="M852.0 468.0 L240.0 468.0" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#a-2e7d32)" stroke-linejoin="round"/><text x="546.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="middle">AP-REP: session established; the KDC is not contacted</text></g>
<g class="st s6"><circle cx="830" cy="468" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="830.0" y="472.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text></g>
<text x="560.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Every ticket is encrypted with a key the client does not have, so the client can carry a ticket it cannot read or alter.</text>
</svg>