<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="t d"><title id="t">Kerberos in three exchanges: the password never crosses the network</title><desc id="d">A client computer exchanges two messages with each of three servers in turn. One and two: AS-REQ, a timestamp encrypted with the password-derived key, and AS-REP, a Ticket-Granting Ticket encrypted with the krbtgt key, with the Authentication Server. Three and four: TGS-REQ, the TGT and the service name, and TGS-REP, a service ticket encrypted with the service account key, with the Ticket-Granting Server. Both servers run on the domain controller, the Key Distribution Center. Five and six: AP-REQ with the service ticket and AP-REP with the service, which never contacts the KDC.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
