<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-labelledby="t d"><title id="t">Threat, vulnerability, and mitigation</title><desc id="d">An attacker, the threat, pushes against a wall of controls that protects servers and data. A crack in the wall is the vulnerability that lets the threat through to the assets, which is risk. A mitigation, such as a patch or a control, closes the crack, so the threat no longer reaches the assets.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
