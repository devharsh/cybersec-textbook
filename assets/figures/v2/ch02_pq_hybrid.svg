<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Post-quantum migration: hybrid key exchange now, classical algorithms retired by 2035</title><desc id="d">In a hybrid key exchange the client and server run a classical elliptic-curve exchange, X25519, and the post-quantum ML-KEM together, and feed both shared secrets into the key derivation function, so the session stays safe if either one breaks. NIST IR 8547 deprecates RSA and elliptic-curve cryptography after 2030 and disallows them after 2035.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
