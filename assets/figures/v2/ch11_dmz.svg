<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t d"><title id="t">A DMZ between two bastion hosts</title><desc id="d">Traffic from the internet passes an outer bastion host into the DMZ, which holds the public web, mail, and DNS servers. An inner bastion host separates the DMZ from the internal network, so a compromise of the outer host or a DMZ server still leaves a second barrier in front of internal systems.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
