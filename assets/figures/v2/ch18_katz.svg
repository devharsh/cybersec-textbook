<g class="st s1"><text x="330.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">of privacy?</text></g>
<g class="st s2"><polygon points="660.0,120.0 800.0,200.0 660.0,280.0 520.0,200.0" fill="#f4f6f8" stroke="#52606d" stroke-width="2" fill-opacity="1"/></g>
<g class="st s2"><text x="660.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">2. Reasonable to</text></g>
<g class="st s2"><text x="660.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">society?</text></g>
