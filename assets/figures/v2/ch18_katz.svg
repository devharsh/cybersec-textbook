<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">The Katz test: two questions decide whether there was a Fourth Amendment search</title><desc id="d">First: did the person have an actual, subjective expectation of privacy? If not, there was no search. Second: is that expectation one society recognizes as reasonable? If not, there was no search. If both are yes, the government action is a search, and a warrant supported by probable cause is generally required.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
