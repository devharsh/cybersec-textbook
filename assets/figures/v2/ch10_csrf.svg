<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Cross-site request forgery: the browser attaches the cookie for the attacker</title><desc id="d">The victim is logged in to the bank, so the browser holds its session cookie. The victim then opens a malicious page whose hidden form posts a transfer to the bank. The browser automatically attaches the bank cookie, and the bank, seeing a valid session, performs the transfer. Anti-CSRF tokens tied to the session and SameSite cookies stop it.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
