<g class="st s8"><text x="104.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">Defenses by stage: phishing-resistant MFA and training; patching and least privilege; EDR to catch staging;</text></g>
