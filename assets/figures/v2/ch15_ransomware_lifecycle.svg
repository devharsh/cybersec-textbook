<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d"><title id="t">The modern ransomware lifecycle: encryption comes last</title><desc id="d">Seven stages: initial access through phishing or an exposed service; execute and persist; escalate and spread; exfiltrate data; disable backups and security tools; encrypt everything; and demand a ransom with a threat to leak the stolen data. Defenses map onto each stage, and tested offline or immutable backups make encryption a recoverable outage.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
