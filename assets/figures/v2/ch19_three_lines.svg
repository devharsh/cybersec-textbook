<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">The three lines model: who owns, who challenges, who assures</title><desc id="d">The board and its audit committee hold accountability and oversight. Executive management directs the first line, which owns and operates controls, such as engineering, IT operations, and application teams, and the second line, which sets policy, monitors, and challenges, such as security, risk, and compliance. The third line, internal audit, provides independent assurance and reports to the audit committee rather than to management.</desc>
