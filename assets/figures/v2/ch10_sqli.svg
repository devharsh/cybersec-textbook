<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">SQL injection: input becomes code, and parameters keep it data</title><desc id="d">The login form sends a username and password. Concatenated into a query, the input &#x27; OR &#x27;1&#x27;=&#x27;1 makes the WHERE clause always true and logs the attacker in; admin&#x27; -- comments out the password check; UNION SELECT reads other tables. A parameterized query sends code and data separately, so the same input is compared as a plain string and matches no user.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
