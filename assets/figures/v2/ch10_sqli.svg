<rect width="1100" height="560" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">SQL injection: input becomes code, and parameters keep it data</text>
<use href="#i-attacker" x="40.0" y="110.0" width="80" height="80"/><text x="80.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Attacker</text>
<g class="st s1"><rect x="170.0" y="90.0" width="260.0" height="120.0" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.6"/></g>
<g class="st s1"><text x="190.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">Username</text></g>
<g class="st s1"><rect x="190.0" y="124.0" width="220.0" height="26.0" rx="4" fill="#fff8e1" fill-opacity="1" stroke="#d9a400" stroke-width="1.2"/></g>
<g class="st s1"><text x="198.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="start">&#x27; OR &#x27;1&#x27;=&#x27;1</text></g>
<g class="st s1"><text x="190.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">Password</text></g>
<g class="st s1"><rect x="190.0" y="178.0" width="220.0" height="22.0" rx="4" fill="#ffffff" fill-opacity="1" stroke="#c5ccd3" stroke-width="1.2"/></g>
<g class="st s1"><circle cx="170" cy="90" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="170.0" y="94.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><use href="#i-server" x="480.0" y="110.0" width="80" height="80"/><text x="520.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Web app</text></g>
<g class="st s2"><path d="M432.0 150.0 L478.0 150.0" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s3"><use href="#i-database" x="915.0" y="105.0" width="90" height="90"/><text x="960.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Database</text></g>
<g class="st s2"><rect x="590.0" y="230.0" width="480.0" height="96.0" rx="8" fill="#1f2933" fill-opacity="1" stroke="#1f2933" stroke-width="1"/></g>
<g class="st s2"><text x="606.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f5b041" font-weight="bold" text-anchor="start">Vulnerable: string concatenation</text></g>
<g class="st s2"><text x="606.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e4e7eb" font-weight="normal" text-anchor="start">SELECT * FROM users WHERE name=&#x27;&#x27; OR &#x27;1&#x27;=&#x27;1&#x27;</text></g>
<g class="st s2"><text x="606.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ff8a80" font-weight="bold" text-anchor="start">AND pass=&#x27;...&#x27;        -&gt; always true</text></g>
<g class="st s2"><circle cx="590" cy="230" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="590.0" y="234.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><path d="M562.0 140.0 L912.0 140.0" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s3"><path d="M912.0 170.0 L562.0 170.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a-c0392b)" stroke-linejoin="round"/><text x="737.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">every user row: logged in as the first, often admin</text></g>
<g class="st s3"><circle cx="880" cy="100" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="880.0" y="104.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><text x="40.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Other payloads</text></g>
<g class="st s4"><circle cx="24" cy="366" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="24.0" y="370.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s4"><text x="60.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">admin&#x27; --</text></g>
<g class="st s4"><text x="60.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="start">comments out the password check</text></g>
<g class="st s4"><text x="60.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">&#x27; UNION SELECT username, password FROM users --</text></g>
<g class="st s4"><text x="60.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="start">reads another table</text></g>
<g class="st s4"><text x="60.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">&#x27; AND SLEEP(5) --</text></g>
<g class="st s4"><text x="60.0" y="506.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="start">blind, time-based inference</text></g>
<g class="st s5"><rect x="590.0" y="360.0" width="480.0" height="110.0" rx="8" fill="#e8f5e9" fill-opacity="1" stroke="#2e7d32" stroke-width="1.6"/></g>
<g class="st s5"><text x="606.0" y="386.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">Fixed: parameterized query (prepared statement)</text></g>
<g class="st s5"><text x="606.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">SELECT * FROM users WHERE name = ? AND pass = ?</text></g>
<g class="st s5"><text x="606.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">the input is data: no user is named &#x27; OR &#x27;1&#x27;=&#x27;1</text></g>
<g class="st s5"><text x="606.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">plus least-privilege database accounts</text></g>
<g class="st s5"><circle cx="590" cy="360" r="12" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text x="590.0" y="364.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s5"><text x="550.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">sqlmap automates the in-band, error-based, and blind variants.</text></g>
</svg>