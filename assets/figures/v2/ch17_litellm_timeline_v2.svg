<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="t d"><title id="t">LiteLLM 2026: months of exposure, minutes of compromise, hours of exposure again</title><desc id="d">May 27: a master key is committed to a public repository, force-pushed over, never revoked. October 10 at 21:27 UTC the key returns an organization owner&#x27;s GitHub token, not scoped down; at 22:11 workflow runs send more maintainer tokens to an outside endpoint. Eleven days later, October 21 from 10:08 to 11:40, branch protection is overridden and a release is built from the fork Berri-AI/litellm; from 11:39 to 11:47 signed wheels reach PyPI and images reach Docker Hub and GHCR, including latest; about 11:47 Socket flags the wheels, about seven minutes after publication; from 13:23 to 14:20 PyPI is frozen and tags are pulled, live about two hours; from 16:20 to 17:01 stolen AWS credentials are tested, consistent with LLMjacking.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
