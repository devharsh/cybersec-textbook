<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">A safe malware analysis lab: isolated, snapshotted, with a fake internet</title><desc id="d">The analyst&#x27;s host runs a Windows analysis VM with FlareVM tools and a REMnux VM on an isolated host-only network with no route to production or the real internet. REMnux runs INetSim, which answers DNS, HTTP, SMTP, and IRC so the sample behaves normally. A clean snapshot is taken before each run and restored afterward.</desc>
