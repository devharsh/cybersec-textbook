<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Network security monitoring: three kinds of record from one tap</title><desc id="d">A network tap on the link between the edge router and the core switch feeds an NSM sensor running Zeek. It produces full packet capture, perfect but expensive and kept briefly; session and flow records such as NetFlow, IPFIX, and Zeek connection logs, which scale and reveal who talked to whom; and protocol metadata for DNS, HTTP, TLS, and files. Flow analysis shows beaconing as connections at a fixed interval and exfiltration as a sudden large upload.</desc>
