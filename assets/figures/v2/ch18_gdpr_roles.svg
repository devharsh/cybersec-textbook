<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">GDPR roles, and the 72-hour breach clock</title><desc id="d">The data subject is the person the data is about. The controller decides why and how personal data is processed and needs a lawful basis; the processor handles the data on the controller&#x27;s behalf, such as a cloud or payroll provider. The data subject holds rights such as access and rectification. If a breach occurs, the controller must notify the supervisory authority within 72 hours of becoming aware, unless the breach is unlikely to put people at risk, and must tell the individuals without undue delay when the risk to them is high.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
