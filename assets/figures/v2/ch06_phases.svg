<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d"><title id="t">The phases of a penetration test, from permission to report and retest</title><desc id="d">Eight phases in order: permission and scoping; reconnaissance; scanning and enumeration; gaining access; privilege escalation; maintaining access; post-exploitation validation and cleanup; and reporting, which leads to remediation and a retest under a new authorization.</desc>
