<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d"><title id="t">The one-time pad: XOR with a truly random key used once</title><desc id="d">Message bits are combined with an equally long random key by XOR to give ciphertext. XOR with the same key again gives the message back. Because every key is equally likely, every message of that length is equally likely, which is perfect secrecy; the key must be as long as the message and never reused.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
