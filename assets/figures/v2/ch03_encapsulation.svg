<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Encapsulation down the TCP/IP stack</title><desc id="d">A laptop sends application data. The transport layer adds a TCP header to make a segment, the internet layer adds an IP header to make a packet, and the link layer adds an Ethernet header and trailer to make a frame. The frame crosses the network through a switch and router, and the server strips the headers in reverse order.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
