<g class="st s3"><circle cx="236" cy="251" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="236.0" y="255.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><rect x="500.0" y="234.0" width="320.0" height="34.0" rx="6" fill="#fff3e0" fill-opacity="1" stroke="#d9822b" stroke-width="1.6"/></g>
<g class="st s4"><text x="660.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d9822b" font-weight="bold" text-anchor="middle">RTO: downtime until restored</text></g>
<g class="st s4"><circle cx="836" cy="251" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="836.0" y="255.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><rect x="500.0" y="276.0" width="480.0" height="30.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#8e44ad" stroke-width="1.6" stroke-dasharray="6 4"/></g>
<g class="st s5"><text x="740.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8e44ad" font-weight="bold" text-anchor="middle">MTD: the most total outage the function can survive</text></g>
<g class="st s5"><circle cx="980" cy="276" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="980.0" y="280.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s3"><text x="375.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">shorter RPO = more frequent backups</text></g>
