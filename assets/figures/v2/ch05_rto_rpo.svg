<line x1="60" y1="190" x2="1050" y2="190" stroke="#52606d" stroke-width="4"/>
<text x="1050.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="bold" text-anchor="end">time</text>
