<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d"><title id="t">How long landmark bugs hid: from the commit that introduced them to public disclosure</title><desc id="d">Shellshock lived in Bash from August 1989 to September 2014, about 25 years. Heartbleed from December 2011 to April 2014, about 2 years. Log4Shell from September 2013 to December 2021, about 8 years. GitLab&#x27;s org-mode bug from June 2014 to October 2026, about 12 years. regreSSHion was first fixed in 2006, reintroduced in October 2020, and disclosed in July 2024, about 4 years. A dashed line marks January 2038, when signed 32-bit time runs out.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
