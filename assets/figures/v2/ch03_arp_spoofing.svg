<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">ARP spoofing: forged replies put the attacker in the middle</title><desc id="d">A victim PC and the default gateway talk through a switch. The attacker sends a forged ARP reply to the victim saying the gateway&#x27;s IP is at the attacker&#x27;s MAC address, and another to the gateway saying the victim&#x27;s IP is at the attacker&#x27;s MAC. Both caches are poisoned, so traffic between victim and gateway now flows through the attacker. Dynamic ARP inspection on the switch drops the forged replies.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
