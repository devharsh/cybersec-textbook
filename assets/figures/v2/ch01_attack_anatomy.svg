<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="t d"><title id="t">The anatomy of an attack</title><desc id="d">A threat actor reaches for an asset. The attack surface is every point an attacker can reach, such as an email inbox, a web server, or a VPN gateway; an attack vector is the path used, such as a phishing email. A vulnerability is a weakness in that surface, an exploit is the code or technique that uses it, and a zero-day is a vulnerability with no fix yet. Risk is the chance the threat reaches the asset; a control reduces it.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
