<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">An end-to-end malware analysis, from hash to report</title><desc id="d">Triage the sample by hash, file type, and threat intelligence. Run static analysis of strings, imports, PE sections, and entropy. If it is packed, unpack it by running to the original entry point and dumping it. Disassemble or decompile it in Ghidra. Run it in a sandbox and watch API calls, files, registry, and network. Extract indicators and write YARA and network signatures. Report capabilities, indicators, and severity.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
