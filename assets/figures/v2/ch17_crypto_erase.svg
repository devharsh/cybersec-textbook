<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 446" width="1180" height="446" role="img" aria-labelledby="t d"><title id="t">Cryptographic erase: destroy the key, not the data</title><desc id="d">Four numbered steps from left to right: encrypt the data from the first write, find every copy of the key, destroy the keys, and verify and record the result, leaving ciphertext that can no longer be read. A fifth panel below lists three ways the erase fails: plaintext written before encryption, a surviving key copy, and an implementation that does not really encrypt or destroy the key.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
