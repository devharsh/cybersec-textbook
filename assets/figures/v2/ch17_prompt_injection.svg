<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">Indirect prompt injection: the attack arrives inside content the agent reads</title><desc id="d">A user asks an AI agent to summarize a web page or an email. The attacker has hidden an instruction in that content, such as telling the agent to send the user&#x27;s files to an outside address. The agent, holding the user&#x27;s authority and tools, may follow it. Defenses: separate trusted instructions from untrusted content, least-privilege tool access, human approval for consequential actions, and output filtering.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
