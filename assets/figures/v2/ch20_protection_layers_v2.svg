<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Layers of protection around a process</title><desc id="d">Nested bands from the inside out: the process, a tank; the basic process control system loop; alarm plus operator response; the safety instrumented system; mechanical relief such as a rupture disc or relief valve; and physical containment such as a dike, bund, or flare. Each layer is credited only if it is independent of the layers around it. The SIS is the last programmable layer, and the last one an attacker can reach over a network.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
