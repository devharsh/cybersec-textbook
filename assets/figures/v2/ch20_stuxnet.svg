<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">Stuxnet: sabotage that reported normal operation</title><desc id="d">Delivered across an air gap by insider or supply-chain means rather than over the internet, Stuxnet reached the Siemens S7-315 PLCs controlling uranium enrichment centrifuges. It commanded the centrifuges to spin at damaging speeds while the SCADA system was shown normal readings. It was the first publicly documented cyberweapon designed to cause physical damage.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
