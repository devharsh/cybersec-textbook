<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">Threat modeling a web app: a data-flow diagram, trust boundaries, and STRIDE</title><desc id="d">A customer&#x27;s browser sends login and order data across the internet trust boundary to a web application, which reads and writes a database inside the internal boundary and calls an external payment API. Each flow that crosses a boundary is checked against STRIDE: spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privilege, each with its matching control.</desc>
