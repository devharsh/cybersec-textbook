<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Forensic acquisition: block writes, image every bit, prove the copy matches</title><desc id="d">The suspect drive connects through a hardware write blocker to the forensic workstation, which makes a bit-for-bit image with dd, dcfldd, or FTK Imager, often in E01 format. A SHA-256 hash of the source and of the image must match; any later re-hash proves the image is unchanged. Analysis happens only on a verified copy. A physical image includes deleted files and unallocated space that a logical copy misses.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
