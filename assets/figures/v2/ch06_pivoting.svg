<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d"><title id="t">Pivoting along a documented critical path</title><desc id="d">From the tester&#x27;s Kali machine at 192.168.1.10, an nmap scan of file server FS1 at 10.10.10.100 finds Apache 2.0.48, RDP, and SMB. An authorized Metasploit exploit of the vulnerable Apache gives a Meterpreter session. A post-exploitation survey of FS1 finds cached credentials. With them the tester moves laterally to domain controller DC1 at 10.10.10.101, and notifies the client monitor. Every step is time-stamped in the operational notes.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
