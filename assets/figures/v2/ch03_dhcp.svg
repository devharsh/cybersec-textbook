<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d"><title id="t">DHCP: the four DORA steps, and how starvation and a rogue server abuse them</title><desc id="d">Left: the client broadcasts Discover, the DHCP server sends an Offer, the client sends Request, and the server sends Acknowledgment with the lease: IP address, default gateway, and DNS server. Servers use UDP port 67 and clients port 68. Right: an attacker floods Discover messages from spoofed MAC addresses until the pool is empty, then runs a rogue DHCP server that names the attacker&#x27;s machine as the default gateway. DHCP snooping lets only the trusted switch port answer.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
