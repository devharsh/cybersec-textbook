<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t d"><title id="t">From source to machine code: four stages, each one inspectable</title><desc id="d">hello.c is preprocessed with gcc -E into hello.i, compiled with gcc -S into assembly in hello.s, assembled with gcc -c into the object file hello.o, and linked with gcc into the executable hello, which the CPU runs.</desc>
