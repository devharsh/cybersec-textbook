<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d"><title id="t">Effect of a security control on annualized loss expectancy</title><desc id="d">Bar chart in US dollars a year: ALE before the control is 60,000, ALE after the control is 9,000, and the control costs 20,000 a year. The control is worth buying because it cuts expected losses by 51,000 a year for 20,000.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
