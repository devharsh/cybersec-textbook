<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d"><title id="t">The reconnaissance funnel: from everything public to a validated target list</title><desc id="d">Five layers narrowing downward. The public internet holds everything. OSINT narrows it to the target&#x27;s domains, people, technology, and documents. WHOIS and the regional internet registries give the IP ranges the target owns. DNS gives hosts, mail servers, and subdomains. The result is a validated target list that feeds scanning in Chapter 8.</desc>
