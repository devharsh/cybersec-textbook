<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d"><title id="t">Wrong-key decryption: garbage output versus a clean rejection</title><desc id="d">Ciphertext decrypted with the wrong key behaves three ways. Stream and counter modes such as CTR, CFB, and OFB give garbage with no error. CBC or ECB with padding gives a padding error about 255 times in 256 and garbage about once in 256. AEAD modes such as AES-GCM and ChaCha20-Poly1305 reject the input because authentication fails.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
