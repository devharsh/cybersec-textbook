<text x="500.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Only authenticated encryption tells you the key or ciphertext is wrong; the other modes fail silently or leak.</text>
