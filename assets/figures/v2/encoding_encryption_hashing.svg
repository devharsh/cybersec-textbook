<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Encoding, encryption, and hashing</title><desc id="d">Three rows. Encoding: data goes through a public scheme such as ASCII or Base64 and anyone can reverse it, no key. Encryption: data goes through a cipher with a secret key, such as AES or RSA, and only a key holder can reverse it. Hashing: data goes through a hash function into a fixed-size digest, with no key and no way back.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
