<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Active scanning can stop a plant; passive monitoring listens instead</title><desc id="d">Left: a scanner sends unsolicited probes to controllers whose fixed loops and untested stacks were never sized for them; a controller faults, a ping sweep moved a standby robotic arm 180 degrees, and another destroyed fifty thousand dollars of wafers. Right: a tap copies existing traffic to a passive sensor, which builds an inventory from protocol payloads and flags a write from a host that only ever read and any device never seen before. Limits: it cannot see silent devices or read encrypted traffic, and it can take days.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
