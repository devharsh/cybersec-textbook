<g class="st s6"><text x="550.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">NIST SP 800-82r3 records a ping sweep that swung a standby robotic arm 180 degrees, and one that destroyed</text></g>
<g class="st s6"><text x="550.0" y="496.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">fifty thousand dollars of wafers. Prefer a tap to a mirror port, which drops frames under load.</text></g>
