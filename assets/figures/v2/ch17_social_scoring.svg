<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-labelledby="t d"><title id="t">Is this AI score prohibited social scoring?</title><desc id="d">A decision flow for Article 5(1)(c) of the EU AI Act. First, the system scores or classifies people over time from their social behavior or personal traits. Second, the score leads to worse treatment. Third, either the treatment happens in a context unrelated to where the data came from, or it is unjustified or disproportionate to the behavior. If both earlier steps hold and either third test is met, the practice has been prohibited since February 2, 2025, for public and private actors alike. If neither third test is met, the score is not banned but may still be high-risk, as credit scoring is, and GDPR Article 22 limits decisions based solely on it.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
