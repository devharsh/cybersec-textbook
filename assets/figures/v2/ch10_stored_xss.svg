<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Stored XSS: one malicious comment runs in every visitor&#x27;s browser</title><desc id="d">The attacker posts a comment containing a script. The server stores it and serves it unencoded to every visitor. Each victim&#x27;s browser runs the script in the site&#x27;s origin, and it sends document.cookie to the attacker&#x27;s server, who reuses the session. Defenses: context-aware output encoding, a Content Security Policy, and HttpOnly cookies.</desc>
