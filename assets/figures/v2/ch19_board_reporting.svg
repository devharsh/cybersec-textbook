<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">Board reporting: translate technical metrics into business outcomes</title><desc id="d">Left: a technical statement such as the number of vulnerabilities patched this month means little to a board. Right: the same work stated as an outcome: mean time to patch critical vulnerabilities fell from 21 to 7 days, cutting the exposure window by 66 percent. Below, common board metrics: mean time to detect, mean time to respond, patch compliance, phishing click rate, open critical findings, third-party coverage, and audit closure.</desc>
