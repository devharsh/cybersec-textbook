<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" role="img" aria-labelledby="t d"><title id="t">CIA triad (defender goals) and DAD triad (attacker goals)</title><desc id="d">Two triangles side by side. The CIA triad has confidentiality, integrity, and availability at its corners, with a shield for the defender. The DAD triad has disclosure, alteration, and destruction, each the opposite of one CIA goal, with an attacker.</desc>
