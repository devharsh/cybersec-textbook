<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Command and control: an implant beacons home over traffic that looks normal</title><desc id="d">An implant on the victim checks in with the C2 server at intervals over HTTPS, DNS, or a trusted cloud service, picks up tasks, and returns results. Jitter varies the interval to evade detection. Frameworks include Cobalt Strike, often cracked and abused, and open-source Sliver, Mythic, and Havoc. Defenders catch the pattern with network monitoring, endpoint telemetry, and memory forensics.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
