<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">An exception is a time-limited risk decision, not a permanent waiver</title><desc id="d">A request names the requirement, scope, and business reason. A compensating control is proposed, the residual risk is rated, and the exception is approved at the level the rating requires. It carries an expiry date and a remediation plan. At expiry, a remediated exception is closed; one not remediated goes back to be re-rated.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}.s8{animation-delay:6.30s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
